<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Replicathon1</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="./assets/logo.png" alt="planet">
        </div>
        <div class="head-button">
            <button class="head-bt1">Products</button>
            <button id="head-bt2">Custom</button>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Contact</a>
            <a id="nav-btn" href="#">Place order</a>
        </nav>
    </header>

     <main>
        <div class="left">
            <h2>FIND YOUR<br>GREATNESS</h2>
            <P>Built for speed and confidence,<br>every pair combines premimum<br>materials and bold design.<br>Engineered for comfort, made for<br>movement.</P>
        </div>

        <div class="center">
            <h1>HYPE</h1>
            <img src="./assets/shoe.png" alt="productImg">
        </div>

        <div class="right">
            <label id="label" for="">Choose Your Color</label>
            <div class="color-plate">
                <button class="color-plate-bt1"></button>
                <button class="color-plate-bt2"></button>
                <button class="color-plate-bt3"></button>
            </div>

            <div class="size">
                <button>40</button>
                <button>42</button>
                <button>44</button>
            </div>

        </div>
    </main>

    <footer>
        <div class="social-links">
            <a href="#">
                <img src="./assets/instagram.svg" alt="instagram">
            </a>

            <a href="#">
                <img src="./assets/facebook.svg" alt="facebook">
            </a>

            <a href="#">
                <img src="./assets/pinterest.svg" alt="pinterest">
            </a>

            <a href="#">
                <img src="./assets/youtube.svg" alt="youtube">
            </a>
        </div>

        <div class="footer-text">
            <span></span> SNEAKERS FOR MORE <span> </span>
        </div>

        <div class="footer-btn">
            <button>See all products <img src="./assets/arrow.svg" alt="arrow"></button>
        </div>

    </footer> 

</body>

</html>
